line-length = 88
target-version = "py313"
extend-exclude = ["*.mdx"]

[format]
quote-style = "double"
indent-style = "space"

[lint]
extend-select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PERF", "FURB",
    "S", "TRY", "RSE", "EM", "N", "A", "Q", "COM", "RET", "ARG", "PTH",
    "T20", "LOG", "G", "TCH", "ANN", "PT", "D", "ERA",
    "PLC", "PLE", "PLR", "PLW",
    "PIE", "ISC", "ICN", "PGH", "FLY", "SLF", "TD", "FIX",
    "YTT", "DTZ", "EXE", "FA", "INT", "INP",
]
ignore = [
    "E501",
    "COM812",
    "ISC001",
    "D100",
    "D104",
    "D203",
    "D213",
    "ANN401",
    "TD002",
    "TD003",
    "FIX002",
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "ARG002",
]

[lint.per-file-ignores]
# The Xorg controller is a dynamic boundary around GI, Qt, Xlib, subprocesses,
# and JSON payloads. Runtime schemas and contract tests validate these values;
# static annotation/docstring rules and generic subprocess heuristics do not.
"plugins/xorg/scripts/**" = [
    "ANN",
    "D",
    "PLC0415",
    "PLR0911",
    "PLR2004",
    "PERF401",
    "S108",
    "S110",
    "S311",
    "S603",
    "S607",
    "TRY301",
]
"plugins/xorg/scripts/xorgctl_lib/common.py" = ["N818"]
"**/tests/**" = [
    "S101",
    "SLF001",
    "ARG001",
    "ARG002",
    "ANN",
    "D",
    "PLR2004",
    "TCH",
]
"plugins/xorg/scripts/tests/**" = [
    "PT009",
    "PT019",
    "PT027",
]
"**/conftest.py" = [
    "ARG001",
    "ARG002",
    "ANN",
    "D",
]
