[lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[lint.pydocstyle]
convention = "google"

[lint.pylint]
max-args = 7
max-returns = 6
max-branches = 15

[lint.mccabe]
max-complexity = 15
