---
name: Herdr Skill Freshness

on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/herdr/**'
      - '.github/workflows/herdr-skill-freshness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Complete vendored skill matches fork
    runs-on: managed-socketless
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch maintained fork skill directory
        run: |
          set -euo pipefail
          upstream_root=$(mktemp -d)
          trap 'rm -rf "$upstream_root"' EXIT
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
            https://codeload.github.com/f5-sales-demo/herdr/tar.gz/refs/heads/build-xcsh \
            -o "$upstream_root/herdr.tar.gz"
          tar -xzf "$upstream_root/herdr.tar.gz" -C "$upstream_root"
          upstream=$(find "$upstream_root" -type d -path '*/skills/herdr' -print -quit)
          test -n "$upstream"
          plugins/herdr/scripts/check-skill-freshness.sh \
            plugins/herdr/skills/herdr "$upstream"

      - name: Record vendored directory digest
        run: |
          set -euo pipefail
          find plugins/herdr/skills/herdr -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum
