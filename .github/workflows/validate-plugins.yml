---
name: Validate Plugins

# No `paths:` filter, deliberately.
#
# `Run plugin test suites` is a REQUIRED check (docs-control #846). GitHub treats a required
# context that never reports as permanently pending, so a path filter would deadlock every
# PR that touches no plugin or script file — which is most of them: five of the last twelve
# merged here were governance sync PRs editing only root and .github files.
#
# Running unconditionally costs about two minutes per PR and removes a whole class of
# unmergeable-through-no-fault-of-yours. If that ever becomes the wrong trade, the fix is a
# companion job that reports the same context trivially when nothing relevant changed —
# not restoring the filter under a required check.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin manifests
    runs-on: managed-socketless
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so check-version-bumps.sh can diff against the PR base sha.
          fetch-depth: 0
          persist-credentials: false

      - name: Run plugin validation
        run: ./scripts/validate-plugins.sh

      - name: Enforce plugin version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check-version-bumps.sh "$BASE_SHA"

  test:
    name: Run plugin test suites
    runs-on: managed-socketless
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository-owned installer verifies the pinned release digest and extracts
      # under runner.temp. Persistent runners may have a live Bun process in ~/.bun,
      # which makes setup-bun's shared-home overwrite fail with ETXTBSY.
      - name: Install bun
        run: ./scripts/install-ci-bun.sh

      - name: Run plugin test suites
        run: ./scripts/run-plugin-tests.sh

      # The runner ships aws, az, gcloud and gh. A test that quietly spawns one passes here
      # and fails on a machine where that CLI is slower or absent — which is how this job
      # broke twice. Replacing the CLIs with sleeping stubs makes any such test name itself.
      - name: Check tests do not depend on a real cloud CLI
        run: ./scripts/check-tests-are-hermetic.sh

  release-tags:
    name: Check published versions are tagged
    # Push only. On a pull request the version being bumped is legitimately untagged — the
    # tag is created at merge — so running this there would fail every release PR.
    if: github.event_name == 'push'
    runs-on: managed-socketless
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every tag: the audit walks all published versions, and
          # release-history.sh refuses a shallow clone rather than reporting "nothing
          # missing" from a history it cannot see.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # This lives here, not in Release Plugins, because the failure it looks for is
      # Release Plugins not finishing. A check inside the workflow that broke cannot report
      # that the workflow broke. Validate Plugins runs on every push to main with no paths
      # filter, so the next commit of any kind surfaces a stuck release.
      - name: Check every published plugin version has a tag
        run: ./scripts/check-release-tags.sh
